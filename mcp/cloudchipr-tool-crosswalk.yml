generated: '2026-09-05'
method: derived
source: >-
  mcp/cloudchipr-mcp.yml (25 provider-published MCP tools) bound against
  openapi/cloudchipr-enterprise-api-openapi.yml (26 operations, OpenAPI 3.0.3)
summary: >-
  The MCP server and the Enterprise REST API are overlapping-but-non-identical projections of the
  same CloudChipr data core. 11 of 25 MCP tools have a public REST operation behind them; 14 are
  MCP-only, and 15 REST operations have no tool. The two surfaces diverge in opposite directions:
  MCP is where savings detail, resource metrics, tags and the whole Kubernetes surface live, and
  REST is where budgets, dashboards, widgets, dimension administration and custom-data ingestion
  live. Neither is a superset.
confidence_basis: >-
  The live MCP tools/list is auth-gated (HTTP 401, see mcp/cloudchipr-mcp.yml#introspection), so no
  tool inputSchema was observable. Every binding below is by published tool description against
  published operation summary/requestBody, and confidence is set accordingly - high only where the
  tool description and the operation describe the same call in the same words. Nothing here asserts
  a schema that was not read.

surfaces:
  openapi:
    file: openapi/cloudchipr-enterprise-api-openapi.yml
    source: https://cloudchipr.github.io/api-service/api.yaml
    base_url: https://api.cloudchipr.com
    operations: 26
    auth: 'apiKey header x-api-key'
    gated: false
    note: The spec document itself is public; the API host 401s every unauthenticated request.
  mcp:
    url: https://mcp.cloudchipr.com/mcp
    tools: 25
    auth: 'OAuth 2.0 (auth0.cloudchipr.com) or API key as bearer'
    gated: true
    note: tools/list returns 401 without a bearer token; schemas require authenticated introspection.
  graphql:
    present: false

coverage:
  mcp_tools: 25
  rest_operations: 26
  bound_tools: 11
  mcp_only_tools: 14
  rest_only_operations: 15

