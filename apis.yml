- aid: cloudchipr:cloudchipr-mcp-server
  name: CloudChipr MCP Server
  tags:
  - MCP
  - agent-native
  - FinOps
  - Cloud Cost Management
  - Kubernetes
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudchipr.com/docs/cloudchipr-mcp-server
  baseURL: https://mcp.cloudchipr.com/mcp
  properties:
  - url: mcp/cloudchipr-mcp.yml
    type: MCPServer
  - url: https://mcp.cloudchipr.com/mcp
    type: MCPServer
  - url: mcp/cloudchipr-tool-crosswalk.yml
    type: ToolCrosswalk
  - url: https://docs.cloudchipr.com/docs/cloudchipr-mcp-server
    type: Documentation
  - url: https://cloudchipr.com/mcp
    type: GettingStarted
  - url: scopes/cloudchipr-scopes.yml
    type: OAuthScopes
  - url: well-known/cloudchipr-well-known.yml
    type: WellKnown
  description: >-
    Hosted, fully remote Model Context Protocol server at https://mcp.cloudchipr.com/mcp exposing 25 read-only
    tools across five categories - cloud accounts and organizations, Billing Explorer, savings opportunities,
    live resources, and Kubernetes. Any MCP client that supports remote servers (Claude, Claude Code,
    ChatGPT, Cursor, Codex) can connect. Authentication is OAuth 2.0 against auth0.cloudchipr.com, or
    a CloudChipr API key passed as a bearer token for headless and CI use. Write actions are advertised
    as "coming soon"; today the server only reads. Nothing is self-hosted and no package is installed.
