      - url: https://docs.cloudchipr.com/reference/integrations
        type: Integrations
    description: >-
      The CloudChipr Enterprise API - 26 operations over 26 paths,
      described by a public OpenAPI 3.0.3 document CloudChipr serves
      from its own GitHub Pages site and links from its homepage and
      docs. Covers billing-explorer aggregation with runtime discovery
      of valid groupings, filters and filter values plus a dry-run
      validate call; savings opportunities; connected cloud accounts;
      live resources and resource lookup; budgets with thresholds and
      period history; cost-allocation dimensions and categories;
      dashboards and three typed widgets; and custom data sources with
      NDJSON ingestion. Authentication is a single x-api-key header
      scheme applied to every operation. Read-heavy: three of the 26
      operations mutate, only one of those carries an idempotency key,
      and none is reversible. No pagination and no documented rate
      limits.
  - aid: cloudchipr:cloudchipr-mcp-server
    name: CloudChipr MCP Server
    tags:
