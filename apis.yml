description: >-
  CloudChipr is a cloud cost-management and FinOps platform that
  consolidates AWS, Azure, GCP, Kubernetes and AI-vendor spend
  (OpenAI, Anthropic, Datadog, Snowflake, MongoDB, Confluent) in a
  single console and automates resource cleanup, rightsizing, and cost
  governance. The product surface centres on Billing Explorer,
  dashboards, live resource management, savings opportunities,
  commitments, budgets and anomaly alerts, no-code automation
  workflows, and integrations with email, Slack, Jira and webhooks.
  Two machine surfaces are published: a 26-operation OpenAPI 3.0.3
  Enterprise API at api.cloudchipr.com, authenticated with an
  x-api-key header and served as a spec at
  cloudchipr.github.io/api-service, and a hosted remote MCP server at
  mcp.cloudchipr.com/mcp exposing 25 read-only tools over OAuth 2.0 or
  a bearer API key. CloudChipr is a FinOps Foundation member, states
  SOC 2 Type II certification, and lists on AWS Marketplace.
