specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: CloudChipr
providerId: cloudchipr
generated: '2026-09-05'
method: searched
source: https://cloudchipr.com/pricing
created: '2026-05-04'
modified: '2026-09-05'
plan_count: 4
supersedes: >-
  REPLACES the 2026-05-04 bulk-sweep scaffold that invented three tiers (Free / Professional /
  Enterprise) with placeholder request quotas and "TBD" prices. None of that was CloudChipr's
  pricing. Every figure below was read from https://cloudchipr.com/pricing on 2026-09-05.
tags:
  - AWS
  - Azure
  - Cloud Cost Management
  - Cost Optimization
  - FinOps
  - GCP
  - Multi-Cloud
  - Resource Cleanup
  - Rightsizing
description: >-
  CloudChipr's published plans. The metering unit is the customer's own MONTHLY CLOUD SPEND, not
  API calls: each tier is defined by a spend band and carries a fixed monthly or annual price plus
  a cap on connected cloud accounts. There is no free tier and no API-call quota or per-request
  price published anywhere - API access is an entitlement of the subscription, not a separate SKU.
pricing_model:
  metric: customer monthly cloud spend
  api_metered: false
  api_call_quota_published: false
  currency: USD
  billing_periods: [monthly, annual]
  annual_discount: 'Save 10% (site label; see per-plan annual prices)'
trial:
  offered: true
  length_days: 14
  credit_card_required: false
  source: 'https://cloudchipr.com/pricing - "Start 14-day free trial. No credit card needed."'
  free_tier: false
  free_tier_note: >-
    The "Free 14-day Trial" column on the pricing page is the trial, not a perpetual free tier.
    There is no free plan.
payment:
  processor: Stripe
  source: https://docs.cloudchipr.com/docs/plans-billing
  note: 'CloudChipr states it does not store or process payment information; Stripe manages payment data.'
procurement:
  - channel: AWS Marketplace
    url: https://aws.amazon.com/marketplace/pp/prodview-enwub346vrmva
  - channel: Direct / contact sales (Enterprise)
    url: https://cloudchipr.com/book-a-demo

plans:
  - id: cloudchipr-basic
    name: Basic
    type: paid
    spend_band: Up to $5k monthly cloud spend
    prices:
      - period: month
        amount: '49.00'
        currency: USD
      - period: year
        amount: '530.00'
        currency: USD
    limits:
      cloud_accounts: 2
    elements:
      - name: Live Resource Management
      - name: Email Integration
      - name: Scheduled Run
  - id: cloudchipr-advanced
    name: Advanced
    type: paid
    spend_band: '$5k - $25k monthly cloud spend'
    prices:
      - period: month
        amount: '189.00'
        currency: USD
      - period: year
        amount: '2040.00'
        currency: USD
    limits:
      cloud_accounts: 10
      integrations: 3
    elements:
      - name: Live Resource Management
      - name: Scheduled Run
      - name: Auto Clean
  - id: cloudchipr-pro
    name: Pro
    type: paid
    spend_band: '$25k - $100k monthly cloud spend'
    prices:
      - period: month
        amount: '890.00'
        currency: USD
      - period: year
        amount: '9560.00'
        currency: USD
    limits:
      cloud_accounts: 20
      integrations: unlimited
    elements:
      - name: Live Resource Management
      - name: Scheduled Run
      - name: Auto Clean
      - name: Anomaly Detection
      - name: Task Management
      - name: Team Access
      - name: Organization SSO
      - name: Explain Reports With AI
      - name: Ask AI
  - id: cloudchipr-enterprise
    name: Enterprise
    type: enterprise
    spend_band: '$100k+ monthly cloud spend'
    prices:
      - period: custom
        amount: custom
        currency: USD
        note: '"Let''s Chat" - contact sales.'
    limits:
      cloud_accounts: '20+'
      integrations: unlimited
    elements:
      - name: Live Resource Management
      - name: Scheduled Run
      - name: Auto Clean
      - name: Anomaly Detection
      - name: Task Management
      - name: Team Access
      - name: Organization SSO
      - name: Explain Reports With AI
      - name: Ask AI
      - name: Dedicated SRE consultant
      - name: Dedicated Slack Channel

api_entitlement:
  note: >-
    Neither the pricing page nor the docs attach API access, API-key count, MCP access or a request
    quota to a specific tier. The API Keys doc says up to two keys per account with no tier
    qualifier, and the MCP docs say any account can create a key. Recorded as unstated rather than
    guessed.
  checked: '2026-09-05'

maintainers:
