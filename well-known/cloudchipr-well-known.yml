generated: '2026-09-05'
method: probed
source: live probes of /.well-known/ on every CloudChipr host named by apis.yml, the OpenAPI servers[] block, the docs host, and the authorization server named by the MCP protected-resource document
summary: >-
  Three real documents are served, none of them on the primary domain. mcp.cloudchipr.com publishes
  RFC 9728 protected-resource metadata for the hosted MCP server, and that document names
  https://auth0.cloudchipr.com as the authorization server — which publishes both RFC 8414
  oauth-authorization-server metadata and OIDC discovery. That is a genuine WellKnown hit and the
  pointer is earned. Nothing else is served: no security.txt on any host (so NO SecurityTxt
  pointer), no api-catalog, no ai-plugin.json, and no A2A agent card anywhere.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the three 200s carrying real JSON documents on
  mcp.cloudchipr.com and auth0.cloudchipr.com. SecurityTxt pointer NOT emitted — RFC 9116 is
  unimplemented on every CloudChipr host probed. AgentCard pointer NOT emitted — see
  false_positive_watch.
false_positive_watch: >-
  app.cloudchipr.com answers HTTP 200 with the same 898-byte React SPA shell for EVERY
  /.well-known/* path, including paths that cannot exist. Those eight 200s are recorded below as
  misses, not hits, and specifically the 200 on /.well-known/agent-card.json is NOT an A2A agent
  card. Any future round that treats an app.cloudchipr.com /.well-known/ 200 as a served document
  is wrong.
hosts:
  - host: mcp.cloudchipr.com
    documents:
      - path: /.well-known/oauth-protected-resource   # RFC 9728
        status: 200
        file: cloudchipr-mcp-oauth-protected-resource.json
      - path: /.well-known/oauth-protected-resource/mcp
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 404
    note: >-
      The protected-resource document declares audience https://api-bff.cloudchipr.com, resource
      https://mcp.cloudchipr.com/mcp, authorization_servers [https://auth0.cloudchipr.com],
      bearer_methods_supported [header] and scopes_supported [openid, profile, email,
      offline_access].
  - host: auth0.cloudchipr.com
    documents:
      - path: /.well-known/openid-configuration        # OIDC Discovery
        status: 200
        file: cloudchipr-auth0-openid-configuration.json
      - path: /.well-known/oauth-authorization-server  # RFC 8414
        status: 200
        file: cloudchipr-auth0-oauth-authorization-server.json
    note: >-
      Auth0 tenant on a CloudChipr-owned CNAME. Discovered ONLY by following authorization_servers[]
      out of the MCP protected-resource document — probing cloudchipr.com alone would have scored
      this provider zero on documents it actually publishes (roadmap#244).
  - host: cloudchipr.com
    documents:
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/openid-configuration
        status: 404
      - path: /.well-known/oauth-authorization-server
        status: 404
