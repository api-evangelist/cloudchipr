summary:
  first_party_sdk_count: 0
  first_party_package_count: 2
  third_party_package_count: 0
  note: >-
    CloudChipr publishes NO client SDK for its Enterprise API in any language or registry. The two
    first-party packages that do exist are infrastructure artifacts, not API clients: a Terraform
    module that connects a customer's cloud account to CloudChipr, and an abandoned npm engine
    library. The documented integration story is raw REST with an `x-api-key` header, plus the
    hosted MCP server for agents.
  sdk_pointer_basis: >-
    An `SDKs` pointer IS emitted because two first-party packages are published and current in the
    registries. It should not be read as "a client library exists" - see sdk_gap below.

sdk_gap:
  client_library_for_the_api: none
  languages_covered: []
  note: >-
    There is no first-party or third-party client for https://api.cloudchipr.com in npm, PyPI,
    RubyGems, crates.io, Go or Maven. An integrator writes HTTP by hand from
    openapi/cloudchipr-enterprise-api-openapi.yml.

