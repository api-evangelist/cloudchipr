    GetResourcesWithFilters:
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  description: The resource type to which filters will be applied
                  enum:
                  - ec2
                  - ebs
                  - eip
                  - elb
                  - rds
                  - elc
                  - vm
                  - disk
                  - ip
                  - lb
                  - sql
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        allOf:
                        - {}
                        - $ref: '#/components/schemas/FilterKeyType'
                      value:
                        oneOf:
                        - type: string
                        - type: integer
                        - type: number
                        - type: boolean
                      operator:
                        allOf:
                        - {}
                        - $ref: '#/components/schemas/FilterOperatorType'
                      metric:
                        allOf:
                        - {}
                        - $ref: '#/components/schemas/FilterMetric'
                    required:
                    - key
                    - operator
              required:
              - type
              - filters
          examples:
            aws-example:
              value:
              - type: ec2
                filters: []
              - type: eip
                filters:
                - key: instance_ids
                  operator: is_absent
                - key: association_ids
                  operator: is_absent
              - type: ebs
                filters:
                - key: attachments
                  operator: is_empty
              - type: elb
                filters:
                - key: instances
                  operator: is_empty
              - type: rds
                filters:
                - key: database_connections
                  value: 1
                  operator: less_than_equal_to
                  metric:
                    statistics_type: maximum
                    since:
                      value: 7
                      unit: days
              - type: elc
                filters:
                - key: launch_time
                  value: 604800
                  operator: less_than_equal_to
            gcp-example:
              value:
              - type: vm
                filters: []
              - type: ip
                filters:
                - key: instance_ids
                  operator: is_absent
                - key: association_ids
                  operator: is_absent
              - type: disk
                filters:
                - key: attachments
                  operator: is_empty
              - type: lb
                filters:
                - key: instances
                  operator: is_empty
              - type: sql
                filters:
                - key: database_connections
                  value: 1
                  operator: less_than_equal_to
                  metric:
                    statistics_type: maximum
                    since:
                      value: 7
                      unit: days
