        share_percentage:
          type: number
          description: The percentage of the resource's cost attributed to this category
          example: 100.00
    Budget:
      type: object
      required:
        - id
        - name
        - type
        - period
        - amount
        - actual_to_date
        - progress
        - thresholds
        - start_date
        - is_expired
      properties:
        id:
