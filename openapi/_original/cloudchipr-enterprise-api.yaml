        - trigger
      properties:
        percent:
          type: number
          description: The threshold as a percentage of the budget amount
          example: 80.0
        amount:
          type: number
          description: The threshold amount derived from the percentage
        trigger:
          type: string
          description: Whether the threshold fires on actual or forecasted spend
          enum:
            - actual
            - forecasted
    BudgetHistoryEntry:
      type: object
      required:
