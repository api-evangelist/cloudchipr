specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: CloudChipr
providerId: cloudchipr
publisherName: CloudChipr
serviceCategory: API
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
#
# CORRECTION 2026-09-05 (enrichment pass, local-v3). The `alignedWith` block below is API
# Evangelist's FRAMING of this provider against the FinOps Framework. It is NOT a CloudChipr
# claim and it is NOT evidenced in CloudChipr's contract. Probed 2026-09-05 against the captured
# 123KB OpenAPI: ZERO occurrences of FOCUS, BilledCost, EffectiveCost, ListCost, ChargeCategory,
# BillingPeriod, ServiceCategory or ProviderName. The only FOCUS-adjacent vocabulary present is
# the AWS-native "unblended"/"amortized" cost types. CloudChipr IS a verified FinOps Foundation
# member (https://www.finops.org/members/cloudchipr/, 200) but membership is not conformance.
# The `focusColumns`, `meters`, `billingModel` and `unitEconomics` blocks below are likewise
# scaffold defaults about billing an API by request, which is NOT how CloudChipr prices - it
# meters the customer's own monthly cloud spend and publishes four fixed-price tiers. See
# plans/cloudchipr-plans-pricing.yml (method: searched) for the real pricing and
# conformance/cloudchipr-conformance.yml#domain_standard for the FOCUS finding.
method: generated
modified: '2026-05-04'
tags:
  - AWS
  - Azure
  - Cloud Cost Management
  - Cost Optimization
  - FinOps
  - GCP
  - Multi-Cloud
  - Resource Cleanup
  - Rightsizing
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the CloudChipr API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: CloudChipr
  ServiceCategory: Developer Tools / API
  ProviderName: CloudChipr
  PublisherName: CloudChipr
  InvoiceIssuerName: CloudChipr
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: CloudChipr API
    baseURL: ''
    tags:
      - Cloud Cost Management
      - FinOps
      - Multi-Cloud
      - Rightsizing
    serviceName: CloudChipr API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
